<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galería | El Jardinero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header class="site-header">
  <nav class="navbar">

    <a class="brand" href="index.html">
      <img class="brand-mark" src="logo.png" alt="El Jardinero">
      <span>El Jardinero</span>
    </a>

    <a href="index.html" class="btn btn-outline">
      ← Volver al inicio
    </a>

  </nav>
</header>


<main>

  <section class="section">

    <div class="section-heading gallery-page-heading">
      <p class="eyebrow">Nuestro trabajo</p>
      <h2>Galería de El Jardinero</h2>
      <p>Fotos y videos de algunos jardines en los que hemos trabajado.</p>
    </div>


    <!-- FOTOS -->

    <h3 class="gallery-column-title">📷 Fotos</h3>

    <div id="gallery-carousel" class="gallery-carousel">

      <div id="gallery-track" class="gallery-track">
        <img src="fotos/jardin-1.jpg" alt="Poda de seto" class="gallery-slide active">
        <img src="fotos/jardin-2.jpg" alt="Mantenimiento de jardín" class="gallery-slide">
        <img src="fotos/jardin-3.jpg" alt="Limpieza y poda de árboles" class="gallery-slide">
        <img src="fotos/jardin-4.jpg" alt="Trabajo de poda en curso" class="gallery-slide">
        <img src="fotos/jardin-5.jpg" alt="Seto recortado" class="gallery-slide">
        <img src="fotos/jardin-6.jpg" alt="Jardín con cerca" class="gallery-slide">
        <img src="fotos/jardin-7.jpg" alt="Trabajo de jardinería" class="gallery-slide">
        <img src="fotos/jardin-8.jpg" alt="Riego de jardín" class="gallery-slide">
        <img src="fotos/jardin-9.jpg" alt="Poda de árbol" class="gallery-slide">
      </div>

      <button type="button" class="gallery-arrow gallery-prev" aria-label="Foto anterior">‹</button>
      <button type="button" class="gallery-arrow gallery-next" aria-label="Foto siguiente">›</button>

      <div id="gallery-dots" class="gallery-dots"></div>

    </div>


    <!-- VIDEOS -->

    <h3 class="gallery-column-title">🎬 Videos</h3>

    <div class="video-grid">

      <video controls preload="none" poster="videos/video-1.jpg" class="video-item">
        <source src="videos/video-1.mp4" type="video/mp4">
      </video>

      <video controls preload="none" poster="videos/video-2.jpg" class="video-item">
        <source src="videos/video-2.mp4" type="video/mp4">
      </video>

      <video controls preload="none" poster="videos/video-3.jpg" class="video-item">
        <source src="videos/video-3.mp4" type="video/mp4">
      </video>

      <video controls preload="none" poster="videos/video-4.jpg" class="video-item video-vertical">
        <source src="videos/video-4.mp4" type="video/mp4">
      </video>

    </div>

  </section>

</main>


<footer class="site-footer">
  <p>© 2026 El Jardinero · Todos los derechos reservados</p>
</footer>


<script src="galeria.js"></script>

</body>
</html>
